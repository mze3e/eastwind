name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (kognita from PyPI, pinned by uv.lock)
        run: uv sync --frozen --extra dev
      - name: Offline suite, every showcase scenario
        run: uv run --no-sync pytest -m "not openai and not live" -q
      - name: The tour, end to end
        run: uv run --no-sync eastwind showcase all --db "$RUNNER_TEMP/tour" > /dev/null
      - name: Wealth workflows and PWM validation
        run: |
          uv run --no-sync eastwind workflow all --db "$RUNNER_TEMP/workflows"
          uv run --no-sync eastwind pwm export -o "$RUNNER_TEMP/pwm.ttl"
          uv run --no-sync eastwind pwm validate "$RUNNER_TEMP/pwm.ttl"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exported evidence with both implementations
        run: |
          uv run --no-sync eastwind run deny --fresh --db "$RUNNER_TEMP/evidence.db"
          uv run --no-sync eastwind evidence export --db "$RUNNER_TEMP/evidence.db" -o "$RUNNER_TEMP/evidence.json"
          scripts/check_evidence.sh "$RUNNER_TEMP/evidence.json"
          EASTWIND_TEST_NPM=1 uv run --no-sync pytest -q -m npm
